<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analista Econômico RAG</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --text: #1e293b;
      --card-bg: #ffffff;
      --border: #e2e8f0;
    }

    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 40px 20px;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #64748b;
      font-size: 1.1rem;
    }

    .main-card {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      border: 1px solid var(--border);
    }

    .assets-tag {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .tag {
      background: #eff6ff;
      color: var(--primary);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid #dbeafe;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #334155;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      font-size: 1rem;
      transition: border-color 0.2s;
      box-sizing: border-box;
      font-family: inherit;
    }

    textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
    }

    button {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .status-bar {
      margin-top: 24px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none; /* Escondido por padrão */
    }

    .status-loading { background: #fef9c3; color: #854d0e; display: block; }
    .status-error { background: #fee2e2; color: #991b1b; display: block; }
    .status-success { background: #dcfce7; color: #166534; display: block; }

    #answer-container {
      margin-top: 30px;
      padding-top: 30px;
      border-top: 2px solid var(--border);
    }

    .markdown-body {
      font-size: 1.05rem;
      color: #334155;
    }

    /* Estilização de tabelas dentro do Markdown */
    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
    }
    .markdown-body th, .markdown-body td {
      border: 1px solid var(--border);
      padding: 10px;
      text-align: left;
    }
    .markdown-body th { background: #f1f5f9; }

    .suggestions {
        margin-top: 15px;
        font-size: 0.9rem;
        color: #64748b;
    }
    .suggestion-link {
        color: var(--primary);
        cursor: pointer;
        text-decoration: underline;
        margin-right: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>📊 Brazil Economic RAG</h1>
      <p class="subtitle">Consulte dados da B3 e indicadores do Banco Central em tempo real. (ultimos 45 dias)</p>
    </header>

    <div class="main-card">
      <div style="text-align: right; margin-bottom: 10px;">
        <a href="/en">EN</a> | <a href="/">PT</a>
      </div>
      <div class="assets-tag">
        <span class="tag">VALE3</span>
        <span class="tag">PETR4</span>
        <span class="tag">ITUB4</span>
        <span class="tag">IPCA</span>
        <span class="tag">SELIC</span>
        <span class="tag">CÂMBIO</span>
      </div>

      <label for="question">O que você deseja analisar?</label>
      <textarea id="question" placeholder="Ex: Qual foi a variação da Vale em março de 2026 comparada ao IPCA?"></textarea>
      
      <div class="suggestions">
        Sugestões: 
        <span class="suggestion-link" onclick="fill('Como fechou a PETR4 ontem?')">PETR4 ontem</span>
        <span class="suggestion-link" onclick="fill('Resumo da inflação (IPCA) nos últimos 4 meses')">Resumo Inflação</span>
        <span class="suggestion-link" onclick="fill('Comparativo VALE3 vs ITUB4 em 2026')">VALE vs ITUB</span>
      </div>

      <div class="actions">
        <div id="loader-text" style="color: #64748b; font-size: 0.9rem;"></div>
        <button id="ask-button">
          <span>Consultar Analista</span>
        </button>
      </div>

      <div id="status" class="status-bar"></div>

      <div id="answer-container" style="display: none;">
        <label>Análise do Especialista:</label>
        <div id="answer" class="markdown-body"></div>
      </div>
    </div>
  </div>

  <script>
    const askButton = document.getElementById("ask-button");
    const questionInput = document.getElementById("question");
    const statusBox = document.getElementById("status");
    const answerBox = document.getElementById("answer");
    const answerContainer = document.getElementById("answer-container");

    // Função para preencher sugestões
    function fill(text) {
        questionInput.value = text;
        questionInput.focus();
    }

    askButton.addEventListener("click", async () => {
      const question = questionInput.value.trim();
      if (!question) {
        showStatus("Por favor, digite uma pergunta.", "error");
        return;
      }

      // Reset de UI
      showStatus("Analizando dados e consultando histórico...", "loading");
      askButton.disabled = true;
      answerContainer.style.display = "none";

      try {
        const response = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question, lang: "pt" })
        });

        const data = await response.json();
        
        if (!response.ok) throw new Error(data.detail || "Erro na API.");

        showStatus(`Sucesso! Agente especializado em <strong>${data.agent || 'Economia'}</strong> respondeu.`, "success");
        
        // Renderizar Markdown
        answerContainer.style.display = "block";
        answerBox.innerHTML = marked.parse(data.answer || "Sem resposta detalhada.");

      } catch (error) {
        showStatus(error.message, "error");
      } finally {
        askButton.disabled = false;
      }
    });

    function showStatus(msg, type) {
      statusBox.innerHTML = msg;
      statusBox.className = "status-bar status-" + type;
    }
  </script>
</body>
</html>
